# fckv.conf — single small config file (ARCHITECTURE §10, validated by config.rs).
# Every value is bounds-checked; unknown keys are rejected.

dram_pool_bytes = 67108864        # 64 MiB DRAM cache/pool (laptop budget)
dram_high_watermark = 0.90
dram_low_watermark = 0.70
hbm_window_bytes = 16777216       # 16 MiB delivered-blocks window (paper ratio: HBM << DRAM << working set), identical both systems
gpu_file_bytes = 268435456        # 256 MiB per pre-allocated scope file
gpu_file_pool = 16
ssd_dir = data/fckv
baseline_ssd_dir = data/baseline
bucket_bytes = 33554432           # 32 MiB per baseline bucket
bucket_count = 128                # total SSD budget 4 GiB both systems
block_tokens = 256
bytes_per_token = 32              # 8 KiB blocks
tau_tokens = 4096                 # OQ-1
l_agent_tokens = 65536            # OQ-2
gap_bridge_bytes = 65536          # paper delta-gap = 64 KiB
ssd_high_watermark = 0.90         # advisory (ARCHITECTURE 5)
ssd_low_watermark = 0.70
ssd_workers = 2
dram_workers = 2
queue_cap = 256
staging_pool_bytes = 134217728    # baseline-only staging budget (128 MiB)
recompute_us_per_token = 8        # modeled:, identical both systems
index_capacity = 1048576
time_scale = 1.0
csv_window_us = 1000000
