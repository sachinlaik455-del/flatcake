# M11 adaptive-placement experiment config (ADAPTIVE_EXTENSION.md).
# Tight budgets (DRAM 8 MiB < ~10 MiB working set) so placement decisions matter;
# schedule compressed 20x (identical for every policy — hit-rate comparison only;
# latency is not an M11 axis). Policies are injected per-run via a copy of this
# file with placement_policy changed (benchmarks/run_m11.sh).

dram_pool_bytes = 2097152
dram_high_watermark = 0.90
dram_low_watermark = 0.70
hbm_window_bytes = 4194304
gpu_file_bytes = 268435456
gpu_file_pool = 16
ssd_dir = data/m11/fckv
baseline_ssd_dir = data/m11/baseline
bucket_bytes = 8388608
bucket_count = 64
block_tokens = 256
bytes_per_token = 32
tau_tokens = 4096
l_agent_tokens = 65536
gap_bridge_bytes = 65536
ssd_high_watermark = 0.90
ssd_low_watermark = 0.70
ssd_workers = 2
dram_workers = 2
queue_cap = 256
staging_pool_bytes = 8388608
recompute_us_per_token = 8
index_capacity = 1048576
time_scale = 0.05
csv_window_us = 1000000
placement_policy = static
adaptive_k = 2
adaptive_h_min = 0.2

# P3 migration knobs (benchmarks/run_p3.sh toggles migration_enabled +
# eviction_policy between the two compared configurations).
migration_enabled = 0
eviction_policy = session_extents
migration_cooldown_ms = 2000
migration_max_per_get = 4

recovery_log = 1
write_coalesce_bytes = 65536
